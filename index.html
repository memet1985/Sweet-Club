<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Waffle Loyalty Club</title>
    
    <!-- PWA / Ana Ekran Ekleme Meta Etiketleri -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sweet Waffle Loyalty Club">
    <link rel="apple-touch-icon" href="logo.webp">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Sweet Waffle Loyalty Club">
    <link rel="icon" sizes="192x192" href="logo.webp">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #171a21; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="w-full bg-[#1e222a]/90 backdrop-blur-md shadow-md py-3 px-6 sticky top-0 z-50 border-b border-gray-800">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="logo.webp" alt="Sweet Waffle Logo" class="w-10 h-10 rounded-full object-cover border border-amber-500/30 shadow-md bg-gray-800">
                <h1 class="text-lg font-bold tracking-wide bg-gradient-to-r from-amber-200 via-amber-400 to-[#d4975d] bg-clip-text text-transparent">Sweet Waffle</h1>
            </div>
            <div class="text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1.5 rounded-full">
                Loyalty Club
            </div>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto p-4 flex-grow space-y-6">
        <div class="bg-[#1e222a] p-6 rounded-3xl shadow-xl border border-gray-800 text-center space-y-4">
            <h2 class="text-xl font-bold text-amber-200">Hoş Geldiniz! 🧇</h2>
            <p class="text-xs text-gray-400">Telefon numaranızı girerek cüzdanınızdaki puanları görüntüleyebilirsiniz.</p>
            
            <div class="space-y-3 pt-2">
                <input type="tel" id="customerPhone" placeholder="05XX XXX XX XX" class="w-full bg-[#171a21] border border-gray-800 rounded-xl px-4 py-3 text-white text-center text-sm focus:outline-none focus:border-amber-500">
                <button onclick="checkCustomerPoints()" class="w-full bg-gradient-to-r from-amber-500 to-[#d4975d] hover:from-amber-600 text-gray-950 font-bold py-3 rounded-xl text-sm transition shadow-md cursor-pointer">
                    Puanlarımı Sorgula
                </button>
            </div>
        </div>

        <div id="customerResultCard" class="hidden bg-[#1e222a] p-5 rounded-3xl shadow-xl border border-gray-800 space-y-3 text-center">
            <p class="text-xs text-gray-400">Müşteri:</p>
            <h3 id="cName" class="text-lg font-bold text-amber-100">-</h3>
            <p class="text-xs text-gray-400 mt-2">Cüzdan Puanınız:</p>
            <p id="cPoints" class="text-3xl font-extrabold text-amber-400">0 Puan</p>
            <p class="text-[11px] text-gray-500 pt-2">Her 200 puanda bir ödül kazanabilirsiniz!</p>
        </div>
    </main>

    <footer class="w-full text-center py-4 text-xs text-gray-500 border-t border-gray-800/60">
        &copy; 2026 Sweet Waffle - Loyalty Club
    </footer>

    <script>
        const SUPABASE_URL = 'https://yatgnoiybbjvmreikeqs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8BxYi7oOUnHvkHAJQNaitQ_kKlHk_Y_';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkCustomerPoints() {
            const phone = document.getElementById('customerPhone').value.trim();
            if (!phone) {
                alert('Lütfen telefon numaranızı giriniz.');
                return;
            }

            let { data, error } = await client.from('customers').select('*').eq('phone', phone).single();

            if (error || !data) {
                alert('Bu telefon numarasına ait kayıt bulunamadı!');
                document.getElementById('customerResultCard').classList.add('hidden');
                return;
            }

            document.getElementById('cName').innerText = data.name;
            document.getElementById('cPoints').innerText = (data.points || 0) + " Puan";
            document.getElementById('customerResultCard').classList.remove('hidden');
        }
    </script>
</body>
</html>
