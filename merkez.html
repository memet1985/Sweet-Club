<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Waffle - Kasa & Merkez Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #171a21; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- ŞİFRE EKRANI (Korumalı Alan) -->
    <div id="authOverlay" class="fixed inset-0 bg-[#171a21] z-50 flex items-center justify-center p-4">
        <div class="bg-[#1e222a] p-6 rounded-3xl shadow-2xl border border-gray-800 max-w-sm w-full text-center space-y-4">
            <div class="space-y-1">
                <h2 class="text-xl font-bold text-amber-200">Merkez Paneli Koruması 🔒</h2>
                <p class="text-xs text-gray-400">Devam etmek için kasa şifresini giriniz.</p>
            </div>
            <div>
                <input type="password" id="centerPassword" placeholder="Kasa Şifresi" class="w-full bg-[#171a21] border border-gray-800 rounded-xl px-4 py-3 text-white text-center text-lg tracking-widest focus:outline-none focus:border-amber-500">
            </div>
            <button onclick="verifyPassword()" class="w-full bg-gradient-to-r from-amber-500 to-[#d4975d] hover:from-amber-600 text-gray-950 font-bold py-3.5 rounded-xl text-sm transition shadow-md cursor-pointer">
                Şifreyi Doğrula
            </button>
        </div>
    </div>

    <!-- MERKEZ / KASA PANELİ -->
    <div id="mainContent" class="opacity-0 transition-opacity duration-500 max-w-md w-full mx-auto p-4 flex-grow flex flex-col justify-center space-y-6">
        <header class="text-center space-y-1">
            <h1 class="text-xl font-bold text-amber-200">Sweet Waffle Kasa Paneli 🧇</h1>
            <p id="targetPhoneText" class="text-xs text-gray-400">Müşteri Bilgileri Yükleniyor...</p>
        </header>

        <div class="bg-[#1e222a] p-6 rounded-3xl shadow-xl border border-gray-800 space-y-4">
            <div id="customerInfo" class="space-y-2 text-sm bg-[#171a21] p-4 rounded-2xl border border-gray-800">
                <p class="text-gray-400">Müşteri verileri bekleniyor...</p>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Eklenecek / Çıkarılacak Puan</label>
                    <input type="number" id="pointInput" placeholder="Örn: 10 veya -10" class="w-full bg-[#171a21] border border-gray-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500">
                </div>
                <button onclick="updateCustomerPoints()" class="w-full bg-gradient-to-r from-amber-500 to-[#d4975d] hover:from-amber-600 text-gray-950 font-bold py-3.5 rounded-xl text-sm transition shadow-md cursor-pointer">
                    Puanı Güncelle
                </button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yatgnoiybbjvmreikeqs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8BxYi7oOUnHvkHAJQNaitQ_kKlHk_Y_';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // BELİRLEDİĞİNİZ KASA ŞİFRESİ (İstediğiniz gibi değiştirebilirsiniz)
        const CORRECT_PIN = "1453"; 

        let customerData = null;
        const urlParams = new URLSearchParams(window.location.search);
        const phone = urlParams.get('phone');

        function verifyPassword() {
            const enteredPin = document.getElementById('centerPassword').value.trim();
            if (enteredPin === CORRECT_PIN) {
                document.getElementById('authOverlay').style.display = 'none';
                const main = document.getElementById('mainContent');
                main.classList.remove('opacity-0');
                loadCustomer();
            } else {
                alert('Hatalı şifre! Lütfen tekrar deneyiniz.');
                document.getElementById('centerPassword').value = '';
            }
        }

        async function loadCustomer() {
            if (!phone) {
                document.getElementById('customerInfo').innerHTML = '<p class="text-red-400 font-medium">Geçersiz veya eksik müşteri bilgisi!</p>';
                document.getElementById('targetPhoneText').innerText = "Hata";
                return;
            }

            document.getElementById('targetPhoneText').innerText = "Telefon: " + phone;

            let { data, error } = await client.from('customers').select('*').eq('phone', phone).single();
            if (data) {
                customerData = data;
                document.getElementById('customerInfo').innerHTML = `
                    <p class="text-amber-200"><strong>Ad Soyad:</strong> ${data.name}</p>
                    <p class="text-gray-300"><strong>Mevcut Puan:</strong> <span class="text-amber-400 font-bold">${data.points || 0}</span></p>
                    <p class="text-gray-300"><strong>Cinsiyet:</strong> ${data.gender || '-'}</p>
                    <p class="text-gray-300"><strong>Doğum Tarihi:</strong> ${data.birthdate || '-'}</p>
                `;
            } else {
                document.getElementById('customerInfo').innerHTML = '<p class="text-red-400">Müşteri sistemde bulunamadı.</p>';
            }
        }

        async function updateCustomerPoints() {
            if (!customerData) return;
            const val = parseInt(document.getElementById('pointInput').value);
            if (isNaN(val)) {
                alert('Lütfen geçerli bir puan miktarı giriniz.');
                return;
            }

            let newPoints = (customerData.points || 0) + val;
            if (newPoints < 0) newPoints = 0;

            let { error } = await client.from('customers').update({ points: newPoints }).eq('phone', phone);

            if (error) {
                alert('Güncelleme başarısız oldu: ' + error.message);
            } else {
                alert('Puan başarıyla güncellendi!');
                document.getElementById('pointInput').value = '';
                loadCustomer();
            }
        }
    </script>
</body>
</html>
